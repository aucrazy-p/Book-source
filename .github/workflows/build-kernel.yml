name: build-probe-kernel

# 探测二进制预编译（方案 §8）：单独 workflow，仅手动触发。
# 产物是 Linux x86_64 ELF，供 daily.yml 的一次性容器拉取执行。
# CI 纪律：无 schedule、无 push 触发；每次构建前由用户确认后手动 dispatch。
on:
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        # musl-tools 提供 musl-gcc：rquickjs 的 C 代码与最终二进制都静态链接，
        # 产物不依赖 glibc，才能稳定跑在 alpine 沙箱里（不受 runner 滚动升级影响）。
        #
        # apt 加固（2026-11-19）：连续两次构建都倒在这一步，报
        #   "Could not wait for server fd - select (11) [IP: 185.125.190.82]"
        # 三处应对：
        #   1) 只装缺的 —— runner 镜像已预装 build-essential/pkg-config，
        #      原写法会去升级它们，白下 3/4 流量并放大失败面；
        #   2) 关掉 http pipeline —— select(11) 的已知诱因；
        #   3) 多次重试 + 把 Azure 专用 mirror+file 兜底换成官方 archive 源。
        run: |
          set -uo pipefail
          need=()
          for p in build-essential pkg-config musl-tools; do
            dpkg -s "$p" >/dev/null 2>&1 || need+=("$p")
          done
          if [ ${#need[@]} -eq 0 ]; then
            echo "系统依赖已全部预装"
            musl-gcc --version | head -1
            exit 0
          fi
          echo "需要安装: ${need[*]}"

          opts="-y -qq --no-install-recommends --fix-missing \
          -o Acquire::Retries=5 -o Acquire::http::Pipeline-Depth=0 \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
          -o Acquire::Languages=none"
          try_install() {
            sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Pipeline-Depth=0 >/dev/null 2>&1 || true
            sudo apt-get install $opts "$@" 2>&1 | tail -15
            return ${PIPESTATUS[0]}
          }

          ok=0
          for i in 1 2 3; do
            echo "--- apt 第 $i 次尝试（当前 mirror 配置）---"
            if try_install "${need[@]}"; then ok=1; break; fi
            sleep 15
          done

          if [ $ok -ne 1 ]; then
            echo "--- 仍失败，切换 archive.ubuntu.com 重试 ---"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            for i in 1 2 3; do
              echo "--- apt 第 $i 次尝试（archive.ubuntu.com）---"
              if try_install "${need[@]}"; then ok=1; break; fi
              sleep 15
            done
          fi

          if [ $ok -ne 1 ]; then
            echo "::error::apt 安装失败：6 次重试均未成功"
            exit 1
          fi
          musl-gcc --version | head -1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: probe-kernel

      - name: Build release
        # 静态链接 musl：产物可跑在任意 Linux 容器，无 glibc 版本依赖。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --manifest-path probe-kernel/Cargo.toml --target x86_64-unknown-linux-musl

      - name: Smoke test (unit tests)
        # 跑 behavior 判定单测，验证 L4 hook 逻辑（不联网）
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test --release --manifest-path probe-kernel/Cargo.toml --target x86_64-unknown-linux-musl behavior::tests -- --nocapture

      - name: Smoke test (four-step probe)
        # 用刚编译的二进制对线上 9 源跑一次四步探测（联网），验证 CLI 运行期正确。
        # 输入是纯 Legado 数组，CLI 自动兼容。只验证、不发布，不碰 daily.yml。
        continue-on-error: true
        timeout-minutes: 20
        run: |
          probe-kernel/target/x86_64-unknown-linux-musl/release/probe-kernel \
            docs/sources.json conf/probe_books.json smoke.jsonl \
            --concurrency 4 --timeout-secs 12
          echo "=== 冒烟结果汇总 ==="
          python3 - <<'PY'
          import json, collections
          rows = [json.loads(l) for l in open('smoke.jsonl', encoding='utf-8') if l.strip()]
          print('探测源数:', len(rows))
          print('status 分布:', dict(collections.Counter(r.get('status') for r in rows)))
          for r in rows:
            print('  %-22s status=%-8s steps_ok=%s hits=%s risk=%s' % (
              str(r.get('book_source_name'))[:22], r.get('status'),
              r.get('steps_ok'), r.get('hits'), r.get('risk_level')))
          PY

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-smoke
          path: smoke.jsonl
          if-no-files-found: ignore

      - name: Package
        run: |
          mkdir -p dist
          cp probe-kernel/target/x86_64-unknown-linux-musl/release/probe-kernel dist/
          file dist/probe-kernel  # 确认静态链接（statically linked）
          cd dist && tar czf probe-kernel-linux-x64.tar.gz probe-kernel
          sha256sum probe-kernel-linux-x64.tar.gz > probe-kernel-linux-x64.tar.gz.sha256

      - name: Publish release asset
        # 用固定 tag 的 Release，重复构建覆盖同名 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view probe-kernel >/dev/null 2>&1 || \
            gh release create probe-kernel --title "probe-kernel" --notes "探测内核预编译产物" --target "$GITHUB_SHA"
          gh release upload probe-kernel \
            dist/probe-kernel-linux-x64.tar.gz \
            dist/probe-kernel-linux-x64.tar.gz.sha256 \
            --clobber
