name: build-probe-kernel

# 探测二进制预编译（方案 §8）：单独 workflow，仅手动触发。
# 产物是 Linux x86_64 ELF，供 daily.yml 的一次性容器拉取执行。
# CI 纪律：无 schedule、无 push 触发；每次构建前由用户确认后手动 dispatch。
on:
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        # musl-tools 提供 musl-gcc：rquickjs 的 C 代码与最终二进制都静态链接，
        # 产物不依赖 glibc，才能稳定跑在 alpine 沙箱里（不受 runner 滚动升级影响）。
        #
        # apt 加固（2026-11-19，第 3 版）：连续三次构建都倒在这一步。
        # 日志证据：
        #   a) "需要安装: build-essential musl-tools" —— 新镜像（26.04）没预装
        #      build-essential，不能再假设依赖现成；
        #   b) "Could not wait for server fd - select (11)" + 多包同时下载失败，
        #      随后 "musl-dev is not selected for install" 连带整个安装中止。
        # 应对：
        #   1) Acquire::Queue-Mode=access —— 强制单连接串行下载，避开并行连接
        #      触发的 select(11)；这是本次的关键改动；
        #   2) 去掉 --fix-missing —— 它只会"修正缺失"然后二次失败、卡在重试里；
        #   3) apt 仍不行就用 curl 直取 .deb 再 dpkg 本地安装，绕开 apt 下载器；
        #      下载地址由 apt 自己的索引算出（自动适配版本号与 amd64v3 变体）；
        #   4) 每步加 timeout，杜绝"卡在这里不动"。
        run: |
          set -uo pipefail
          echo "=== 环境诊断 ==="
          if [ -f /etc/os-release ]; then
            . /etc/os-release
            echo "OS: ${PRETTY_NAME:-unknown}"
          fi
          echo "ulimit -n = $(ulimit -n)"
          env | grep -iE '^(http_proxy|https_proxy|all_proxy|no_proxy)=' || echo "代理环境变量: 无"
          apt-config dump 2>/dev/null | grep -iE 'Queue-Mode|Pipeline-Depth|::Proxy' || echo "apt 队列/代理配置: 默认"

          need=()
          for p in build-essential musl musl-dev musl-tools; do
            dpkg -s "$p" >/dev/null 2>&1 || need+=("$p")
          done
          if [ ${#need[@]} -eq 0 ]; then
            echo "依赖已全部预装"
            musl-gcc --version | head -1
            exit 0
          fi
          echo "需要安装: ${need[*]}"

          ACQ='-o Acquire::Queue-Mode=access -o Acquire::http::Pipeline-Depth=0
               -o Acquire::Retries=3 -o Acquire::http::Timeout=60
               -o Acquire::https::Timeout=60'
          run_apt() {
            timeout 420 sudo apt-get "$@" $ACQ 2>&1 | tail -12
            return ${PIPESTATUS[0]}
          }

          run_apt update -qq || echo "(apt update 未完全成功，继续尝试安装)"
          ok=0
          for i in 1 2 3; do
            echo "--- apt install 第 $i 次（单连接模式）---"
            if run_apt install -y -qq --no-install-recommends "${need[@]}"; then ok=1; break; fi
            sleep 10
          done

          if [ $ok -ne 1 ]; then
            echo "--- apt 下载仍失败，改用 curl 直取 .deb + dpkg ---"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            run_apt update -qq || true
            mkdir -p /tmp/debs && rm -f /tmp/debs/*.deb
            uris=$(apt-get install --print-uris -y --no-install-recommends "${need[@]}" 2>/dev/null \
                   | grep -oE "'https?://[^']+\.deb'" | tr -d "'" | sort -u)
            echo "$uris" | sed 's/^/  URI: /'
            dl=0
            for u in $uris; do
              f="/tmp/debs/$(basename "$u")"
              if curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --max-time 180 -o "$f" "$u"; then
                dl=$((dl+1)); echo "  下载成功 $(basename "$u")"
              else
                echo "  下载失败 $u"
              fi
            done
            if [ "$dl" -gt 0 ]; then
              sudo dpkg -i /tmp/debs/*.deb && ok=1
              sudo dpkg --configure -a || true
            fi
          fi

          if [ $ok -ne 1 ]; then
            echo "::error::依赖安装失败：apt 与 curl 两条路都没成功"
            exit 1
          fi
          echo "=== 校验 ==="
          musl-gcc --version | head -1
          gcc --version | head -1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: probe-kernel

      - name: Build release
        # 静态链接 musl：产物可跑在任意 Linux 容器，无 glibc 版本依赖。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --manifest-path probe-kernel/Cargo.toml --target x86_64-unknown-linux-musl

      - name: Smoke test (unit tests)
        # 跑 behavior 判定 + 出口白名单策略单测（不联网）。
        # 注意 egress 单测用 OnceLock，进程内只设一次，需分两个测试进程跑：
        # 先 behavior，再 egress（各自独立二进制实例）。
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo test --release --manifest-path probe-kernel/Cargo.toml --target x86_64-unknown-linux-musl behavior::tests -- --nocapture
          # egress 单测要逐例切 MODE（全局 RwLock），必须串行跑，否则并行互相覆盖
          cargo test --release --manifest-path probe-kernel/Cargo.toml --target x86_64-unknown-linux-musl crawler::egress::tests -- --nocapture --test-threads=1

      - name: Smoke test (egress injection, Python)
        # 出口白名单的 Python 侧注入单测（纯标准库，不联网）：declared_hosts 提取 / is_new。
        run: python3 -m unittest tests.test_egress_input -v

      - name: Smoke test (four-step probe)
        # 用刚编译的二进制对线上 9 源跑一次四步探测（联网），验证 CLI 运行期正确。
        # 输入是纯 Legado 数组，CLI 自动兼容。只验证、不发布，不碰 daily.yml。
        continue-on-error: true
        timeout-minutes: 20
        run: |
          probe-kernel/target/x86_64-unknown-linux-musl/release/probe-kernel \
            docs/sources.json conf/probe_books.json smoke.jsonl \
            --concurrency 4 --timeout-secs 12
          echo "=== 冒烟结果汇总 ==="
          python3 - <<'PY'
          import json, collections
          rows = [json.loads(l) for l in open('smoke.jsonl', encoding='utf-8') if l.strip()]
          print('探测源数:', len(rows))
          print('status 分布:', dict(collections.Counter(r.get('status') for r in rows)))
          for r in rows:
            print('  %-22s status=%-8s steps_ok=%s hits=%s risk=%s' % (
              str(r.get('book_source_name'))[:22], r.get('status'),
              r.get('steps_ok'), r.get('hits'), r.get('risk_level')))
          PY

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-smoke
          path: smoke.jsonl
          if-no-files-found: ignore

      - name: Package
        run: |
          mkdir -p dist
          cp probe-kernel/target/x86_64-unknown-linux-musl/release/probe-kernel dist/
          file dist/probe-kernel  # 确认静态链接（statically linked）
          cd dist && tar czf probe-kernel-linux-x64.tar.gz probe-kernel
          sha256sum probe-kernel-linux-x64.tar.gz > probe-kernel-linux-x64.tar.gz.sha256

      - name: Publish release asset
        # 用固定 tag 的 Release，重复构建覆盖同名 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view probe-kernel >/dev/null 2>&1 || \
            gh release create probe-kernel --title "probe-kernel" --notes "探测内核预编译产物" --target "$GITHUB_SHA"
          gh release upload probe-kernel \
            dist/probe-kernel-linux-x64.tar.gz \
            dist/probe-kernel-linux-x64.tar.gz.sha256 \
            --clobber
