name: daily-source-pick

# 每天定时采集候选源 → 规范化去重 → 探测 → 边际选源，产物上传 artifact。
# 精选池跨轮累积（A 方案）：每轮开始下载上一轮的池状态 artifact，结束后上传本轮池状态。
# 注意：本 workflow 无 push 触发；推送代码不会引发构建。
on:
  schedule:
    # UTC 16:23 = 北京时间 00:23，避开整点拥塞（cron 在 UTC，整点易延迟/丢弃）
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # 上传 artifact + 通过 API 读上一轮池状态（write 含 read）

concurrency:
  group: daily-source-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEGADO_SY_RUNS_DIR: ${{ github.workspace }}/runs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 跨轮状态恢复（A 方案核心）----
      # 从「最近一次成功运行」的 pool-state artifact 取回精选池，落到 runs/_state/pool.json。
      # 首轮没有 artifact 时 warn 后跳过，06_pool.py 会自动从空池冷启动，不报错。
      - name: Restore pool state from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: daily.yml
          name: pool-state
          path: runs/_state
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Collect candidate sources from yiove
        # 采集：按合集访问量取前 8 个，不做 3 万条全量；限速 0.8s/请求
        run: python3 scripts/collect_yiove.py ci --collections 8 --pages 1

      - name: Normalize, probe and select
        # 探测 50 个候选（约 7 分钟）；checkKeyWord 判连接 + 5经典5热门交叉验证
        run: |
          SNAP=runs/ci/sources_snapshot.json
          if [ ! -s "$SNAP" ]; then
            echo "::error::采集失败：sources_snapshot.json 不存在或为空"
            exit 2
          fi
          # --pool 必须带：否则不调用 06_pool 的 plan/commit，artifact 传来的池状态无人读写
          python3 scripts/run_pipeline.py "$SNAP" --run-id ci --pool --limit 50 --stop 0.02

      - name: Publish summary
        run: |
          echo "## 选源结果" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          p = os.path.join("runs", "ci", "white.json")
          d = json.load(open(p, encoding="utf-8"))
          print("精选源 **%d** 个，覆盖 %d/%d 探针书 (%.0f%%)\n"
                % (len(d["sources"]), d["covered_books"], d["total_probe_books"],
                   d["coverage"] * 100))
          print("| 源 | 经典 | 热门 | 响应ms |")
          print("|---|---|---|---|")
          for s in d["sources"]:
            print("| %s | %s | %s | %s |" % (s["bookSourceName"], s["hit_classic"],
                                             s["hit_hot"], s["respond_time_ms"]))
          print("\n可导入文件：`bookSources.json`（artifact 内，纯标准书源数组，直接导入阅读 APP）")
          PY

      # ---- 跨轮状态上传（A 方案核心）----
      # 固定名字 pool-state，次日由上面的步骤取回。保留 90 天足够（每天覆盖生成新的）。
      - name: Upload pool state for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-state
          path: runs/_state/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-pick-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs/ci/
          retention-days: 30
          if-no-files-found: warn

      # ---- 联动 Bsource：把本轮精选书源推到 Bsource 仓库 sources.json ----
      # GITHUB_TOKEN 只能写本仓库，跨仓库写必须用 PAT（secrets.BSOURCE_PUSH_TOKEN）。
      # push 到 Bsource/main 会触发 GitHub Pages 自动重建，页面随之更新。
      - name: Publish sources.json to Bsource
        if: success()
        env:
          BSOURCE_TOKEN: ${{ secrets.BSOURCE_PUSH_TOKEN }}
        run: |
          set -e
          if [ -z "$BSOURCE_TOKEN" ]; then
            echo "::error::Secret BSOURCE_PUSH_TOKEN 未配置或名字不对，跳过发布"
            exit 2
          fi
          SRC="runs/ci/bookSources.json"
          if [ ! -s "$SRC" ]; then
            echo "::error::bookSources.json 不存在或为空，跳过发布"
            exit 2
          fi
          echo "发布书源数: $(python3 -c "import json;print(len(json.load(open('$SRC'))))")"
          rm -rf .bsource-publish
          git clone --depth 1 "https://x-access-token:${BSOURCE_TOKEN}@github.com/aucrazy-p/Bsource.git" .bsource-publish
          cp "$SRC" .bsource-publish/sources.json
          cd .bsource-publish
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          if git diff --cached --quiet; then
            echo "sources.json 内容无变化，跳过 commit（避免无意义提交）"
          else
            git commit -m "chore: 自动更新书源 ($(date -u +%Y-%m-%d))"
            git push origin main
            echo "::notice::已发布 sources.json 到 Bsource，Pages 将自动重建"
          fi
