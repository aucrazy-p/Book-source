name: daily-source-pick

# 每天定时采集候选源 → 规范化去重 → 探测 → 边际选源，产物上传 artifact。
# 精选池跨轮累积（A 方案）：每轮开始下载上一轮的池状态 artifact，结束后上传本轮池状态。
# 注意：本 workflow 无 push 触发；推送代码不会引发构建。
on:
  schedule:
    # UTC 16:23 = 北京时间 00:23，避开整点拥塞（cron 在 UTC，整点易延迟/丢弃）
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      egress_mode:
        description: '出口白名单模式：observe(只记不拦) / semiblock(拦陌生域带数据) / fullblock(全量四档)'
        required: false
        default: 'observe'
        type: choice
        options: [observe, semiblock, fullblock]

permissions:
  contents: write  # 发布 sources.json 回本仓库 docs/（GITHUB_TOKEN push，不触发新 workflow）
  actions: write   # 上传 artifact + 通过 API 读上一轮池状态（write 含 read）

concurrency:
  group: daily-source-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEGADO_SY_RUNS_DIR: ${{ github.workspace }}/runs
      # 灰度阶段由 dispatch 输入决定；定时触发恒为 observe（最安全）。
      PROBE_EGRESS_MODE: ${{ inputs.egress_mode || 'observe' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 跨轮状态恢复（A 方案核心）----
      # 从「最近一次成功运行」的 pool-state artifact 取回精选池，落到 runs/_state/pool.json。
      # 首轮没有 artifact 时 warn 后跳过，06_pool.py 会自动从空池冷启动，不报错。
      - name: Restore pool state from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: daily.yml
          name: pool-state
          path: runs/_state
          workflow_conclusion: success
          if_no_artifact_found: warn

      # ---- 精品源补给缓存（大合集 89MB 只下第一次，之后永久复用）----
      # key 固定版本号：候选 8000+ 条筛 66 个足够，无需每周重扫。
      # daily 每天 restore 即算访问，刷新 GitHub 的 7 天未访问删除计时器 → 缓存不回收。
      # 命中缓存时 collect_yiove.py 的 load_premium_pool 直接读，重筛后并入候选（规则更新即时生效）。
      # 要拿上游新版大合集：把下面 key 的 -v1 手动升到 -v2 触发一次重下。
      - name: Compute premium cache key
        id: premium-cache
        # 固定 key，不含 date/周数，否则每周失效重下（用户 2026-11-27 定：一次下载即可）。
        # 故意不设 restore-keys：前缀匹配可能命中旧版本缓存。
        run: echo "key=premium-df898047-f6f3-4437-93c6-147edc8559b3-v1" >> "$GITHUB_OUTPUT"

      - name: Restore premium pool from cache
        uses: actions/cache@v4
        with:
          path: runs/ci/premium_pool.jsonl
          key: ${{ steps.premium-cache.outputs.key }}

      - name: Collect candidate sources from yiove
        # 采集：按合集访问量取前 8 个 + 固定大合集精选源补给（--premium）。
        # 大合集导出 89MB / 84s，缓存命中则跳过下载；限速 0.8s/请求。
        run: python3 scripts/collect_yiove.py ci --collections 8 --pages 1 --premium

      - name: Download probe-kernel binary
        # Rust 四步探测内核（方案 §17.1）：搜索→详情→目录→正文真跑通 + L4 行为观测。
        # 二进制由 build-probe-kernel（仅手动触发）预编译发布到 release tag=probe-kernel。
        # 这里只下载现成二进制执行，不在 daily 里现编译（避免每轮 10+ 分钟冷编译）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p bin
          gh release download probe-kernel --repo "$GITHUB_REPOSITORY" \
            --pattern 'probe-kernel-linux-x64.tar.gz' --dir bin --clobber
          tar xzf bin/probe-kernel-linux-x64.tar.gz -C bin
          chmod +x bin/probe-kernel
          ./bin/probe-kernel 2>&1 | head -3 || true
          echo "probe-kernel ready"

      - name: Normalize, plan pool, prepare Rust probe input
        # 只跑到 06_pool plan：产出 targets.jsonl（本轮要探的源）。
        # 再把 targets.jsonl 转成 Rust CLI 输入（透传 source_id/content_hash，保证能关联回池）。
        run: |
          set -e
          SNAP=runs/ci/sources_snapshot.json
          if [ ! -s "$SNAP" ]; then
            echo "::error::采集失败：sources_snapshot.json 不存在或为空"
            exit 2
          fi
          python3 scripts/01_fetch_probe_books.py ci
          python3 scripts/02_normalize.py "$SNAP" ci
          python3 scripts/06_pool.py plan ci --size 66
          python3 scripts/make_probe_input.py ci
          echo "targets=$(wc -l < runs/ci/targets.jsonl) rust_input=$(python3 -c "import json;print(len(json.load(open('runs/ci/probe_input.json'))))")"

      - name: Probe (Rust four-step CLI in sandbox)
        # 四步真探测替代旧 Python 搜索层命中。head 门禁：头部至少 1 本四步全过（§17.1 B-2）。
        # 不可信书源 JS 在一次性容器里执行（方案 §11）：非 root、只读根、tmpfs、
        # cgroup 内存/PID 限制、硬超时；容器不注入任何 token/Secret。
        # 输出 matrix.jsonl 直接喂 04_select / 06_pool commit。
        run: |
          set -e
          # 1) 沙箱底座镜像（非 root；probe-kernel 二进制运行时挂载，不固化进镜像）
          docker build -q -t probe-sandbox -f probe-kernel/Dockerfile probe-kernel/
          # 2) 让容器内非 root 用户(uid 10001)可写产物目录
          chmod -R a+rwX runs
          # 3) 一次性容器执行；timeout 只是最后的兜底闸（真正的闸在 kernel 内部：
          #    --per-source-secs 单源墙钟 + --global-budget-secs 整轮预算）。
          #    2026-11-19 run 44416491025 曾以 1232s 撞穿 1200s 被 SIGKILL(exit 137)，
          #    故外层放宽到 1800s 留安全垫，不再承担限速职责。
          docker rm -f probe-sandbox-run 2>/dev/null || true
          timeout --signal=TERM --kill-after=30s 1800s \
          docker run --rm --name probe-sandbox-run \
            --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges --user 10001:10001 \
            --tmpfs /tmp:rw,nosuid,size=256m \
            --tmpfs /home/probe:rw,nosuid,size=64m \
            --memory=2g --memory-swap=2g --cpus=2 --pids-limit=512 \
            -e PROBE_EGRESS_MODE="${PROBE_EGRESS_MODE:-observe}" \
            -v "$PWD/bin/probe-kernel:/usr/local/bin/probe-kernel:ro" \
            -v "$PWD/runs:/work/runs:rw" \
            probe-sandbox \
            /work/runs/ci/probe_input.json \
            /work/runs/ci/probe_books.json \
            /work/runs/ci/matrix.jsonl \
            --concurrency 4 --timeout-secs 12 \
            --read-timeout-secs 15 --per-source-secs 100 --global-budget-secs 1200 \
            --min-chapters 3 --min-content-chars 500 \
            --min-books-pass 1 --min-head-rate 0.5 --min-waist-rate 0.4 --min-flagship 2 \
            --min-hot-rate 0.7 \
            --host-policy /work/runs/ci/host_policy.json
          docker rm -f probe-sandbox-run 2>/dev/null || true
          python3 - <<'PY'
          import json, collections
          rows = [json.loads(l) for l in open('runs/ci/matrix.jsonl', encoding='utf-8') if l.strip()]
          print('探测源数:', len(rows))
          print('status:', dict(collections.Counter(r.get('status') for r in rows)))
          print('PASSED 明细:')
          for r in rows:
            if r.get('status') == 'PASSED':
              print('  %-20s 长尾=%s 腰部=%s 头部=%s/%s steps=%s risk=%s' % (
                str(r.get('bookSourceName'))[:20], r.get('hit_longtail'), r.get('hit_waist'),
                r.get('hit_classic'), r.get('hit_hot'), r.get('steps_ok'), r.get('risk_level')))
          PY

      - name: Select and commit pool
        # 04_select 出本轮参考白名单；06_pool commit 把 PASSED 源并入池并导出 bookSources.json。
        run: |
          set -e
          python3 scripts/04_select.py ci --stop 0.02
          python3 scripts/06_pool.py commit ci --fail 2 --blocked 3

      - name: Publish summary
        run: |
          echo "## 选源结果" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          p = os.path.join("runs", "ci", "white.json")
          d = json.load(open(p, encoding="utf-8"))
          print("精选源 **%d** 个，覆盖 %d/%d 探针书 (%.0f%%)\n"
                % (len(d["sources"]), d["covered_books"], d["total_probe_books"],
                   d["coverage"] * 100))
          print("| 源 | 经典 | 热门 | 响应ms |")
          print("|---|---|---|---|")
          for s in d["sources"]:
            print("| %s | %s | %s | %s |" % (s["bookSourceName"], s["hit_classic"],
                                             s["hit_hot"], s["respond_time_ms"]))
          print("\n可导入文件：`bookSources.json`（artifact 内，纯标准书源数组，直接导入阅读 APP）")
          PY

      # ---- 跨轮状态上传（A 方案核心）----
      # 固定名字 pool-state，次日由上面的步骤取回。保留 90 天足够（每天覆盖生成新的）。
      - name: Upload pool state for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-state
          path: runs/_state/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-pick-${{ github.run_number }}-${{ github.run_attempt }}
          path: runs/ci/
          retention-days: 30
          if-no-files-found: warn

      # ---- 联动 Pages：把本轮精选书源写回本仓库 docs/sources.json ----
      # 单仓库方案：Book-source 自带 GitHub Pages（/docs），域名 ivv.loc.cc 挂这里。
      # 用 GITHUB_TOKEN push 回自己仓库，不需要 PAT，也无跨仓库复制。
      # GitHub 对 GITHUB_TOKEN 的 push 不触发新 workflow（防递归），符合 CI 纪律。
      - name: Publish sources.json to docs/
        if: success()
        run: |
          set -e
          SRC="runs/ci/bookSources.json"
          DST="docs/sources.json"
          if [ ! -s "$SRC" ]; then
            echo "::error::bookSources.json 不存在或为空，跳过发布"
            exit 2
          fi
          echo "发布书源数: $(python3 -c "import json;print(len(json.load(open('$SRC'))))")"
          cp "$SRC" "$DST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DST"

          # 只看 sources.json 是否变化：决定 updated 是否刷新
          if git diff --cached --quiet -- "$DST"; then
            SOURCES_CHANGED=0
            echo "sources.json 内容无变化：updated 保持原值，仅刷新 last_run"
          else
            SOURCES_CHANGED=1
            echo "sources.json 内容有变化：同时刷新 updated 与 last_run"
          fi

          # meta.json 两个时间戳字段：
          #   updated  —— 书源内容变更时间（仅 sources.json 有变化才写）
          #   last_run —— 每天巡检都写（哪怕书源无变化，页面也能看到今天跑过）
          SOURCES_CHANGED="$SOURCES_CHANGED" python3 - <<'PY'
          import json, datetime, os
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          path = 'docs/meta.json'
          try:
              meta = json.load(open(path))
          except Exception:
              meta = {}
          if not isinstance(meta, dict):
              meta = {}
          meta['last_run'] = now
          if os.environ.get('SOURCES_CHANGED') == '1':
              meta['updated'] = now
          meta.setdefault('updated', now)  # 老仓库首次补字段时兜底
          with open(path, 'w') as f:
              json.dump(meta, f, ensure_ascii=False)
          print('meta.json:', meta)
          PY
          git add docs/meta.json

          # last_run 每天都会变，故每轮必有提交（Pages 依赖 push 触发重建）
          if git diff --cached --quiet; then
            echo "暂存区无变化，跳过 commit"
          else
            git commit -m "chore: 每日更新 ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
            echo "::notice::已发布 sources.json / meta.json 到 docs/，Pages 将自动重建"
          fi

      # ---- Actions 记录自动清理：删除 7 天前的 workflow run ----
      # 保持 Actions 页面整洁（pages-build-deployment 每次 push 都产生一条，堆积快）。
      # 注意：DELETE run 会连带删除其 artifact，pool-state 每天由最新轮覆盖生成，
      # 7 天保留期不影响次日恢复。runs 总量每天约 10 条，per_page=100 单页足够。
      - name: Cleanup workflow runs older than 7 days
        if: always()
        run: |
          set -e
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "清理 UTC $CUTOFF 之前的 run"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          IDS=$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "$API/runs?per_page=100" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(' '.join(str(r['id']) for r in d['workflow_runs'] if r['created_at'] < '$CUTOFF'))
          ")
          N=0
          for id in $IDS; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $TOKEN" "$API/runs/$id")
            if [ "$code" = "204" ]; then N=$((N+1)); else echo "::warning::删除 run $id 返回 $code"; fi
          done
          echo "已清理 $N 条 7 天前的 run"
